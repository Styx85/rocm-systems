Wave Life:
  Wave Life:
    rst: Average number of cycles from wavefront creation to completion. Longer wavefront life indicates more execution time per wavefront, which may be due to complex kernels, memory latency, or synchronization waits.
    unit: Cycles
Wave Instruction Mix:
  Total Instructions:
    rst: Total number of instructions executed across all wavefronts, per normalization unit.
    unit: Count per Normalization Unit
  Instructions - Internal:
    rst: Internal SQ instructions (SQ_INSTS_INTERNAL) per normalization unit. These represent bookkeeping or non-user-visible work issued by the SQ.
    unit: Count per Normalization Unit
  Instructions - VALU:
    rst: Number of Vector ALU instructions executed, per normalization unit. VALU handles arithmetic and logic operations across all work-items in a wavefront.
    unit: Count per Normalization Unit
  Instructions - SALU:
    rst: Number of Scalar ALU instructions executed, per normalization unit. SALU handles operations with uniform values across the wavefront.
    unit: Count per Normalization Unit
  Instructions - SMEM:
    rst: Number of scalar memory instructions executed, per normalization unit. SMEM loads constant and uniform data, such as constant buffers and kernel arguments, through the scalar cache.
    unit: Count per Normalization Unit
  Instructions - Transcendental:
    rst: Transcendental VALU instructions (SQ_INSTS_VALU_TRANS) per normalization unit. These cover hardware approximations such as sin, cos, and log on the vector ALU.
    unit: Count per Normalization Unit
  Instructions - Dual VALU (VOPD):
    rst: The number of dual-issue VALU instructions issued in wave32 mode per normalization unit. The VOPD encoding pairs two independent VALU operations that issue in the same cycle.
    unit: Count per Normalization Unit
  Instructions - VMEM:
    rst: Number of vector memory instructions executed, including global, buffer, and texture operations, per normalization unit. High VMEM counts relative to VALU may indicate memory-bound workloads.
    unit: Count per Normalization Unit
  Instructions - LDS:
    rst: Number of LDS instructions issued by the shader, including FLAT instructions that resolve to LDS, per normalization unit. This counts instructions rather than data movement, so it does not distinguish reads from writes.
    unit: Count per Normalization Unit
