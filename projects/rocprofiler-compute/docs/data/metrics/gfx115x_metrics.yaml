LDS Instruction Mix:
  LDS Direct Load Instructions:
    rst: Number of direct LDS load instructions, which fetch data from LDS without address indirection, per normalization unit. These are typically faster than indexed LDS operations.
    unit: Count per Normalization Unit
  LDS Parameter Load Instructions:
    rst: Number of LDS parameter load instructions, per normalization unit. These load shader input parameters that have been staged in LDS for efficient access by the wavefront.
    unit: Count per Normalization Unit
  WAVE32 LDS Parameter Load Instructions:
    rst: Number of LDS parameter loads executed in wave32 mode, per normalization unit. RDNA 3.5 supports both wave32 and wave64 execution modes, with wave32 providing lower latency for some operations.
    unit: Count per Normalization Unit
Wait State Analysis:
  Wait for Any:
    rst: Percentage of wavefront execution time spent waiting for data dependencies to resolve, such as pending memory operations or prior instruction results. High values indicate latency-bound execution that could benefit from increased occupancy or reduced dependency chains.
    unit: Percent
  Wait for Instruction Fetch:
    rst: Percentage of wavefront lifetime spent waiting for instruction fetch. High values may indicate instruction cache misses, large kernel code, or divergent control flow impacting instruction locality.
    unit: Percent
  Wait for Barrier:
    rst: Percentage of wavefront lifetime spent at barrier synchronization points. High barrier wait times may indicate workload imbalance within workgroups.
    unit: Percent
  Wait for Counter:
    rst: Percentage of wavefront lifetime spent waiting for memory operation counters. High values indicate memory latency is impacting performance.
    unit: Percent
WGP Instruction Cache:
  Icache Hit Rate:
    rst: Percentage of L1I requests that hit on a previously loaded line in the cache. Calculated as the number of L1I hits over the number of hits and misses, excluding duplicate misses.
    unit: Percent
WGP Scalar Data Cache:
  DCache Hit Rate:
    rst: Percentage of sL1D requests that hit on a previously loaded line in the cache. Calculated as the number of sL1D hits over the number of hits and misses, excluding duplicate misses.
    unit: Percent
GL0 Utilization:
  GL0 Busy (TCP):
    rst: Percentage of cycles the GL0 vector cache (TCP) is actively processing requests; each Workgroup Processor has its own GL0/TCP instance. Low utilization may indicate compute-bound workloads with minimal memory traffic or idle shader engines.
    unit: Percent
GL0 Request Statistics:
  Total Requests:
    rst: Total number of requests to the GL0 vector cache, including reads, writes, and atomics, per normalization unit. This represents the overall memory traffic generated by vector memory instructions from the shader cores.
    unit: Requests per Normalization Unit
  Read Requests:
    rst: Number of read requests to the GL0 vector cache, per normalization unit. High read counts indicate memory-intensive load operations.
    unit: Requests per Normalization Unit
  Write Requests:
    rst: Number of write requests to the GL0 vector cache, including global memory stores and cache writebacks, per normalization unit. High write counts indicate write-intensive workloads.
    unit: Requests per Normalization Unit
  Miss Requests:
    rst: Number of GL0 cache requests that missed and required fetching from the GL1 cache, per normalization unit. High miss counts increase memory access latency.
    unit: Count per Normalization Unit
GL0 Cache Performance:
  Hit Rate:
    rst: Percentage of GL0 vector cache (TCP Cache) requests that hit in cache; the TCP cache is the first-level cache for vector memory operations. High hit rates reduce traffic to the GL1 cache and improve memory access latency.
    unit: Percent
GL0-GL1 Interface:
  GL1 Read Requests:
    rst: Number of read requests forwarded from GL0 (TCP) to GL1 cache due to misses, per normalization unit. This represents GL0 miss traffic that must be serviced by higher cache levels.
    unit: Requests per Normalization Unit
  GL1 Read 128B Requests:
    rst: Number of 128-byte read requests forwarded from GL0 (TCP) to GL1 cache, per normalization unit. This represents large cache line fetches for memory-intensive workloads.
    unit: Count per Normalization Unit
  GL1 Write Requests:
    rst: Number of write requests forwarded from GL0 (TCP) to GL1 cache, per normalization unit. This includes writebacks and stores that missed in GL0.
    unit: Requests per Normalization Unit
GL0 Stalls:
  TA Req Stall:
    rst: Cycles the Texture Addresser was stalled waiting for the GL0 cache to accept requests, per normalization unit. High stall counts indicate GL0 cache backpressure limiting memory request throughput.
    unit: Cycles per Normalization Unit
  GL1 Back Pressure:
    rst: Cycles the GL0 cache was stalled due to backpressure from the GL1 cache, per normalization unit. High values indicate GL1 cache contention or bandwidth limitations impacting GL0 throughput.
    unit: Cycles per Normalization Unit
  Data FIFO Stall:
    rst: Cycles the GL0 cache data FIFO was stalled, per normalization unit. High stall counts may indicate data path congestion or insufficient buffering for high-throughput workloads.
    unit: Cycles per Normalization Unit
GL1 Cache Utilization:
  GL1 Cache Busy:
    rst: Percentage of cycles the GL1 cache, shared by the Workgroup Processors of a Shader Engine, is actively processing requests. High utilization indicates active memory traffic from the GL0 caches.
    unit: Percent
  GL1 Cache Starve:
    rst: Percentage of cycles the GL1 cache had no pending requests. High starvation indicates either compute-bound workloads with minimal memory traffic, or effective GL0 caching reducing traffic to GL1.
    unit: Percent
GL1 Cache Request Statistics:
  Total Requests:
    rst: Total number of requests received by the GL1 cache from all GL0 caches (TCP instances) within the shader engine, per normalization unit. This represents aggregated memory traffic from multiple Workgroup Processors.
    unit: Requests per Normalization Unit
  Read Requests:
    rst: Number of read requests to the GL1 cache, which are loads that missed in GL0, per normalization unit. High read counts indicate memory-intensive load operations.
    unit: Requests per Normalization Unit
  Write Requests:
    rst: Number of write requests to the GL1 cache, including stores that missed in GL0 and cache writebacks, per normalization unit. High write counts may indicate write-intensive workloads.
    unit: Requests per Normalization Unit
  Miss Requests:
    rst: Number of GL1 cache requests that missed and required fetching from GL2, per normalization unit. High miss counts increase memory latency and traffic to GL2.
    unit: Count per Normalization Unit
GL1 Cache Performance:
  Hit Rate:
    rst: Percentage of L1 cache (GL1C) requests that hit in cache; GL1C is shared across the workgroup processors of a shader engine. Higher hit rates reduce traffic to the L2 cache and improve performance.
    unit: Percent
GL1-GL2 Interface:
  GL2 Read Requests:
    rst: Number of read requests forwarded from GL1 to GL2 cache due to misses, per normalization unit. High counts may indicate GL1 capacity limitations.
    unit: Requests per Normalization Unit
  GL2 Read 128B Requests:
    rst: Number of 128-byte read requests forwarded from GL1 to GL2 cache, per normalization unit. This represents large cache line fetches for memory-intensive workloads.
    unit: Requests per Normalization Unit
  GL2 Write Requests:
    rst: Number of write requests forwarded from GL1 to GL2 cache, per normalization unit. This includes writebacks and stores that missed in GL1.
    unit: Requests per Normalization Unit
GL1 Cache Stalls:
  GL2 Stall:
    rst: Cycles the GL1 cache was stalled waiting for GL2 to accept requests, per normalization unit. High stall counts indicate GL2 bandwidth saturation or contention, limiting GL1 throughput.
    unit: Cycles per Normalization Unit
  LFIFO Full Stall:
    rst: Cycles the GL1 cache was stalled due to the LFIFO (Load FIFO) being full, per normalization unit. High stall counts indicate data return path congestion from GL2 to GL1.
    unit: Cycles per Normalization Unit
GL2 Cache Performance:
  GL2 Cache Hit Rate:
    rst: Percentage of GL2 cache requests that are serviced from cache without accessing system memory. Low hit rates may indicate poor data locality or working sets that exceed cache capacity.
    unit: Percent
  GL2 Cache Hits:
    rst: Number of GL2 cache requests that were serviced from cache, per normalization unit. High hit counts relative to total requests indicate effective caching.
    unit: Count per Normalization Unit
  GL2 Cache Misses:
    rst: Number of GL2 cache requests that missed and required fetching through GCEA (Graphics Core Efficiency Arbiter), per normalization unit. High miss counts indicate heavy memory traffic.
    unit: Count per Normalization Unit
GL2 Cache Request Statistics:
  Total Requests:
    rst: Total number of requests received by the GL2 cache from all GL1 caches and other clients, per normalization unit. This represents the aggregate memory traffic at the GPU's final on-chip cache.
    unit: Count per Normalization Unit
  Read Requests:
    rst: Number of read requests to the GL2 cache, per normalization unit. High read counts indicate memory-intensive load operations.
    unit: Count per Normalization Unit
  Write Requests:
    rst: Number of write requests to the GL2 cache, including stores and cache writebacks from GL1, per normalization unit. High write counts indicate write-intensive workloads.
    unit: Count per Normalization Unit
  Atomic Requests:
    rst: Number of atomic memory operations processed by the GL2 cache, per normalization unit. Atomics may serialize at contended addresses, so high counts may impact performance.
    unit: Count per Normalization Unit
  EA Read Requests (DRAM):
    rst: Number of read requests forwarded from GL2 cache through GCEA (Graphics Core Efficiency Arbiter) toward system memory, per normalization unit. System-level caches may serve these requests before they reach DRAM.
    unit: Count per Normalization Unit
  EA Write Requests (DRAM):
    rst: Number of write requests, including evictions and writebacks, forwarded from GL2 cache through GCEA (Graphics Core Efficiency Arbiter) toward system memory, per normalization unit. High counts indicate write-intensive workloads consuming memory bandwidth.
    unit: Count per Normalization Unit
GL2 Cache Bandwidth:
  GL2 Cache Read BW:
    rst: Bandwidth of read operations at the L2 cache level. This metric shows overall L2 cache utilization and helps identify memory subsystem bottlenecks.
    unit: GB/s
  GL2 Cache Write BW:
    rst: The number of bytes the GL1 caches write to the GL2 cache, divided by total duration. High bandwidth indicates memory-intensive write patterns.
    unit: GB/s
DRAM Read Interface:
  DRAM Read Requests:
    rst: Number of read requests sent to system memory (DDR5/LPDDR5 on RDNA 3.5 APUs), per normalization unit. High read request counts indicate memory-intensive workloads that may be bandwidth limited.
    unit: Count per Normalization Unit
  DRAM Read Chained Requests:
    rst: Number of sequential read request chains to system memory, per normalization unit. Chained requests combine multiple sequential accesses for better memory efficiency.
    unit: Count per Normalization Unit
  DRAM Read Banks Active:
    rst: Number of system memory banks with pending read requests, per normalization unit. More active banks enable better memory-level parallelism.
    unit: Count per Normalization Unit
  DRAM Read Size (32B increments):
    rst: Total volume of read data transferred from system memory, in 32-byte increments, per normalization unit. This quantifies memory read bandwidth consumption.
    unit: Count per Normalization Unit
DRAM Write Interface:
  DRAM Write Requests:
    rst: Number of write requests sent to system memory, per normalization unit. High write request counts indicate write-intensive workloads.
    unit: Count per Normalization Unit
  DRAM Write Chained Requests:
    rst: Number of sequential write request chains to system memory, per normalization unit. Chained writes combine sequential stores for better efficiency.
    unit: Count per Normalization Unit
  DRAM Write Banks Active:
    rst: Number of system memory banks with pending write requests, per normalization unit. More active banks enable better write bandwidth.
    unit: Count per Normalization Unit
  DRAM Write Size (32B increments):
    rst: Total volume of write data transferred to system memory, in 32-byte increments, per normalization unit. This quantifies memory write bandwidth consumption.
    unit: Count per Normalization Unit
System Arbiter (SARB):
  SARB Busy:
    rst: Percentage of cycles the System Arbiter is actively processing memory requests. High values indicate significant off-chip memory traffic, a key indicator of memory-bound behavior.
    unit: Percent
  SARB Stalled:
    rst: Percentage of cycles the System Arbiter has requests but cannot make progress due to downstream backpressure. High stall rates indicate memory bandwidth saturation or system memory contention.
    unit: Percent
  SARB Starving:
    rst: Percentage of cycles the System Arbiter has no requests to process. High starvation indicates compute-bound workloads or effective caching reducing memory traffic.
    unit: Percent
  SARB Total Requests:
    rst: Total memory requests processed by the System Arbiter, per normalization unit. This represents all traffic between the GPU caches and system memory interface, including reads, writes, and atomics.
    unit: Count per Normalization Unit
  SARB DRAM Requests:
    rst: Number of memory requests destined for system memory (DRAM), excluding requests serviced by other system components, per normalization unit.
    unit: Count per Normalization Unit
Return Interface:
  Read Returns:
    rst: Number of completed read operations returning data from system memory to the GPU caches, per normalization unit.
    unit: Count per Normalization Unit
  Write Returns:
    rst: Number of completed write acknowledgements from system memory, per normalization unit.
    unit: Count per Normalization Unit
  Probe Requests:
    rst: Number of cache coherency probe operations, per normalization unit. These occur when external agents or system components require cache synchronization.
    unit: Count per Normalization Unit
GPU Utilization:
  GPU Busy:
    rst: Percentage of time the GPU was actively processing work, the primary measure of overall GPU activity. Low values indicate underutilization, possibly due to insufficient workload or host-side bottlenecks.
    unit: Percent
  CP Busy:
    rst: Percentage of GPU active time the Command Processor was busy dispatching work and processing commands. High CP busy with low shader activity may indicate dispatch bottlenecks or excessive command stream overhead.
    unit: Percent
  GL2C Busy:
    rst: Percentage of GPU active time the GL2 cache was busy servicing memory requests. Compare with compute activity to determine if the workload is memory-bound or compute-bound.
    unit: Percent
Shader Engine Utilization:
  TA Busy:
    rst: Percentage of GPU active time the Texture Addresser was busy calculating memory addresses for texture or buffer memory operations.
    unit: Percent
WGP Utilization:
  WGP Utilization:
    rst: Percentage of GPU active cycles where the Workgroup Processor is busy executing wavefronts. RDNA 3.5 WGPs contain two compute units, each with dual SIMD32 units. Low utilization may indicate insufficient parallelism or resource bottlenecks.
    unit: Percent
Command processor fetcher (CPF):
  CPC Busy:
    rst: Percentage of time the Command Processor Compute is actively processing commands. High busy percentage indicates efficient command stream processing. Low values may indicate gaps in workload submission or dispatch bottlenecks.
    unit: Percent
  CPC Idle:
    rst: Percentage of time the Command Processor Compute has no work to process. High idle time indicates underutilization, often due to gaps between kernel dispatches or insufficient workload to keep the GPU busy.
    unit: Percent
  CPC Stalled:
    rst: Percentage of time the Command Processor Compute is stalled waiting for resources. High stall rates may indicate memory bottlenecks, synchronization issues, or contention for internal command processor resources.
    unit: Percent
Command processor packet processor (CPC):
  TCIU Busy:
    rst: Percentage of time the Texture Cache Interface Unit is busy handling command processor memory requests. High utilization indicates significant memory traffic from command processing activities.
    unit: Percent
  UTCL2 Busy:
    rst: Percentage of time the Unified Translation Cache L2 interface is busy handling address translation requests. High utilization may indicate heavy virtual memory activity or TLB pressure.
    unit: Percent
  GCRIU Busy:
    rst: Percentage of time the Graphics Cache Rinse Interface Unit is busy. This unit handles cache coherency operations. High utilization may indicate frequent cache flushes or synchronization points.
    unit: Percent
Workgroup manager utilizations:
  SPI Busy:
    rst: Percentage of GPU active cycles where the Shader Processor Input is busy dispatching wavefronts. High SPI busy indicates active workload dispatch. Low values may suggest insufficient parallelism or dispatch bottlenecks limiting GPU utilization.
    unit: Percent
Workgroup Manager - Resource Allocation:
  Compute Wave Dispatches:
    rst: Total number of compute wavefronts dispatched by the Shader Processor Input. This represents the work scheduled for execution on the shader engines. Compare with completed waves to identify dispatch-related bottlenecks.
    unit: Count per Normalization Unit
  Wave Dispatch Rate:
    rst: Average wavefronts dispatched per GPU active cycle. Values greater than one indicate parallel dispatch across multiple shader engines. Low dispatch rates may indicate workload submission bottlenecks or insufficient parallelism in the application.
    unit: Waves/cycle
Wavefront launch stats:
  WGP Utilization:
    rst: Percentage of GPU active cycles where the Workgroup Processor is busy executing wavefronts. RDNA 3.5 WGPs contain two compute units, each with dual SIMD32 units. Low utilization may indicate insufficient parallelism or resource bottlenecks.
    unit: Percent
Compute Speed-of-Light:
  GL1 Cache Busy:
    rst: Percentage of cycles the GL1 cache is actively processing requests. GL1 cache is shared across multiple Workgroup Processors within a Shader Engine. High utilization indicates active memory traffic from the GL0 caches.
    unit: Percent
  GL1 Cache Starve:
    rst: Percentage of cycles the GL1 cache had no pending requests. High starvation indicates either compute-bound workloads with minimal memory traffic, or effective GL0 caching reducing traffic to GL1.
    unit: Percent
Pipeline statistics:
  Total Requests:
    rst: Total number of requests received by the GL1 cache from all GL0 caches (TCP instances) within the shader engine. This represents aggregated memory traffic from multiple Workgroup Processors.
    unit: Count per Normalization Unit
  Read Requests:
    rst: Number of read requests to the GL1 cache. High read counts indicate memory-intensive load operations that missed in GL0. Compare with miss requests to assess GL1 cache effectiveness.
    unit: Count per Normalization Unit
  Write Requests:
    rst: Number of write requests to the GL1 cache. Write traffic includes stores that missed in GL0 and cache writebacks. High write counts may indicate write-intensive workloads.
    unit: Count per Normalization Unit
  Miss Requests:
    rst: Number of GL1 cache requests that missed and required fetching from GL2. High miss counts increase memory latency and traffic to GL2. Consider improving data locality at the shader engine level.
    unit: Count per Normalization Unit
Arithmetic operations:
  Hit Rate:
    rst: Percentage of GL1 cache requests serviced from cache. Higher hit rates reduce traffic to GL2 and improve performance. Low hit rates may indicate working sets exceeding GL1 capacity or poor data locality across Workgroup Processors.
    unit: Percent
L1I Speed-of-Light:
  GL2 Cache Hit Rate:
    rst: Percentage of GL2 cache requests serviced from cache without forwarding through GCEA (Graphics Core Efficiency Arbiter). GL2 cache is the GPU's final on-chip cache before accessing system memory. Higher hit rates significantly reduce memory bandwidth pressure and improve performance.
    unit: Percent
  GL2 Cache Hits:
    rst: Number of GL2 cache requests that were serviced from cache. High hit counts relative to total requests indicate effective caching. Low hit counts suggest memory-bound workloads or poor data locality.
    unit: Count per Normalization Unit
  GL2 Cache Misses:
    rst: Number of GL2 cache requests that missed and required fetching through GCEA (Graphics Core Efficiency Arbiter). High miss counts indicate heavy memory traffic. Consider improving data locality or reducing working set size.
    unit: Count per Normalization Unit
L1I cache accesses:
  Total Requests:
    rst: Total number of requests received by the GL2 cache from all GL1 caches and other clients. This represents the aggregate memory traffic at the GPU's final on-chip cache.
    unit: Count per Normalization Unit
  Read Requests:
    rst: Number of read requests to the GL2 cache. High read counts indicate memory-intensive load operations. Compare with hit rate to assess GL2 cache effectiveness for reads.
    unit: Count per Normalization Unit
  Write Requests:
    rst: Number of write requests to the GL2 cache. Write traffic includes stores and cache writebacks from GL1. High write counts indicate write-intensive workloads.
    unit: Count per Normalization Unit
  Atomic Requests:
    rst: Number of atomic memory operations processed by the GL2 cache. Atomics provide thread-safe memory access but may serialize at contended addresses. High counts may impact performance.
    unit: Count per Normalization Unit
  EA Read Requests (DRAM):
    rst: Number of read requests forwarded from GL2 cache through GCEA (Graphics Core Efficiency Arbiter). These requests go toward system memory, though they may be served by system-level caches before reaching DRAM. High counts indicate memory-bound workloads.
    unit: Count per Normalization Unit
  EA Write Requests (DRAM):
    rst: Number of write requests forwarded from GL2 cache through GCEA (Graphics Core Efficiency Arbiter). These include evictions and writebacks going toward system memory. High counts indicate write-intensive workloads consuming memory bandwidth.
    unit: Count per Normalization Unit
L1I <-> L2 interface:
  GL2 Cache Read BW:
    rst: Achieved read bandwidth at the GL2 cache level. This represents total read traffic from GL1 caches to GL2. High bandwidth indicates memory-intensive read patterns.
    unit: Bytes/s
  GL2 Cache Write BW:
    rst: Achieved write bandwidth at the GL2 cache level. This represents total write traffic from GL1 caches to GL2. High bandwidth indicates memory-intensive write patterns.
    unit: Bytes/s
Scalar L1D Speed-of-Light:
  DRAM Read Requests:
    rst: Number of read requests sent to system memory. RDNA 3.5 APUs use DDR5/LPDDR5 system memory. High read request counts indicate memory-intensive workloads that may be bandwidth limited.
    unit: Count per Normalization Unit
  DRAM Read Chained Requests:
    rst: Number of sequential read request chains to system memory. Chained requests combine multiple sequential accesses for better memory efficiency. High chain counts indicate good memory access patterns.
    unit: Count per Normalization Unit
  DRAM Read Banks Active:
    rst: Number of system memory banks with pending read requests. More active banks enable better memory-level parallelism. Low bank utilization may indicate suboptimal access patterns limiting bandwidth.
    unit: Count per Normalization Unit
  DRAM Read Size (32B increments):
    rst: Total volume of read data transferred from system memory. This metric helps quantify memory read bandwidth consumption. Compare with theoretical bandwidth to assess memory utilization.
    unit: Count per Normalization Unit
Scalar L1D cache accesses:
  DRAM Write Requests:
    rst: Number of write requests sent to system memory. High write request counts indicate write-intensive workloads. Combined with read requests, this shows total memory traffic.
    unit: Count per Normalization Unit
  DRAM Write Chained Requests:
    rst: Number of sequential write request chains to system memory. Chained writes combine sequential stores for better efficiency. High chain counts indicate good write access patterns.
    unit: Count per Normalization Unit
  DRAM Write Banks Active:
    rst: Number of system memory banks with pending write requests. Higher bank utilization enables better write bandwidth. Low values may indicate access pattern issues.
    unit: Count per Normalization Unit
  DRAM Write Size (32B increments):
    rst: Total volume of write data transferred to system memory. This quantifies memory write bandwidth consumption. High values indicate write-intensive workloads.
    unit: Count per Normalization Unit
L2 Speed-of-Light:
  GPU Busy:
    rst: Percentage of time the GPU was actively processing work. This is the primary utilization metric showing overall GPU activity. Low GPU busy indicates underutilization, possibly due to insufficient workload or host-side bottlenecks.
    unit: Percent
  CP Busy:
    rst: Percentage of GPU active time the Command Processor was busy dispatching work and processing commands. High CP busy with low shader activity may indicate dispatch bottlenecks or excessive command stream overhead.
    unit: Percent
  GL2C Busy:
    rst: Percentage of GPU active time the GL2 cache was busy servicing memory requests. High GL2 busy indicates memory-intensive workloads. Compare with compute activity to determine if the workload is memory-bound or compute-bound.
    unit: Percent
L2-Fabric interface metrics:
  TA Busy:
    rst: Percentage of GPU active time the Texture Addresser was busy processing memory address calculations. High TA busy indicates active texture or buffer memory operations. This reflects the address generation workload for memory requests.
    unit: Percent
