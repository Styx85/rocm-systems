  ICache Hit Rate:
    rst: Percentage of L1I requests that hit on a previously loaded line in the cache. Calculated as the number of L1I hits over the number of hits and misses, excluding duplicate misses.
    unit: Percent
  ICache-GL1 Read Bandwidth:
    rst: Bandwidth of instruction cache requests to the GL1 cache. High values may indicate instruction cache pressure from large kernels or frequent instruction cache misses.
    unit: GB/s
Memory chart - Scalar Data Cache:
  DCache Requests:
    rst: ''
    unit: Requests per Normalization Unit
  DCache Hit Rate:
    rst: Percentage of sL1D requests that hit on a previously loaded line in the cache. Calculated as the number of sL1D hits over the number of hits and misses, excluding duplicate misses.
    unit: Percent
  DCache-GL1 Read Bandwidth:
    rst: Bandwidth of scalar data cache requests to the GL1 cache. Scalar operations load uniform data shared across all threads in a wavefront, making efficient caching critical for performance.
    unit: GB/s
Memory chart - TCP Cache:
  TCP Read Requests:
    rst: Number of read requests to the GL0 vector cache, per normalization unit. High read counts indicate memory-intensive load operations.
    unit: Requests per Normalization Unit
  TCP Write Requests:
    rst: Number of write requests to the GL0 vector cache, including global memory stores and cache writebacks, per normalization unit. High write counts indicate write-intensive workloads.
    unit: Requests per Normalization Unit
  GL0 Cache Hit Rate (TCP Cache):
    rst: Percentage of GL0 vector cache (TCP Cache) requests that hit in cache; the TCP cache is the first-level cache for vector memory operations. High hit rates reduce traffic to the GL1 cache and improve memory access latency.
    unit: Percent
  GL0 Cache BW:
    rst: The number of bytes the shader cores request from the GL0 vector cache (TCP Cache), divided by total duration. High bandwidth indicates memory-intensive workloads.
    unit: GB/s
Memory chart - LDS (Local Data Share):
  LDS Req:
    rst: Number of LDS instructions issued by the shader, including FLAT instructions that resolve to LDS, per normalization unit. This counts instructions rather than data movement, so it does not distinguish reads from writes.
    unit: Count per Normalization Unit
  LDS Utilization:
    rst: Percentage of the LDS cycle budget across all CUs spent servicing indexed (non-direct, non-interpolation) accesses, measured over GPU-active cycles. Because two CUs share a workgroup processor's LDS, a saturated LDS reads well below 100% on this architecture.
    unit: Percent
  LDS Bank Conflict Rate:
    rst: Percentage of LDS accesses that experienced bank conflicts, which occur when multiple work-items in a wavefront access different addresses in the same LDS bank. High conflict rates reduce effective LDS bandwidth.
    unit: Percent
  LDS Estimated Bandwidth:
    rst: 'Estimated achieved Local Data Share bandwidth: LDS active cycles without bank conflicts times 4 bytes per bank, divided by total duration. RDNA 3.5 provides 32 LDS banks per compute unit.'
    unit: GB/s
Memory chart - TCP-GL1 Interface:
  TCP-GL1 Read Bandwidth:
