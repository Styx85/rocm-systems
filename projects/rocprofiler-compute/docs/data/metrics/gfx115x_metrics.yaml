Memory chart - GL2 Cache:
  GL2 Cache Utilization:
    rst: ''
    unit: Percent
  GL2 Cache Hit Rate:
    rst: Percentage of GL2 cache requests that are serviced from cache without accessing system memory. Low hit rates may indicate poor data locality or working sets that exceed cache capacity.
    unit: Percent
  GL2-Fabric Read BW:
    rst: The number of bytes the GL2 cache reads from the memory fabric or system memory, divided by total duration. Its peak requires $max_mclk populated in sysinfo (max MEM clock from amd-smi).
