System Speed-of-Light:
  VALU FLOPs:
    rst: VALU floating-point operations per second, counted as all VALU instructions times the wavefront size. The peak assumes single-issue FP32 FMA (128 FLOPs/CU/cycle); VOPD dual-issue doubles throughput to 256 FLOPs/CU/cycle for FP32 and 512 for packed FP16.
    unit: GFLOP/s
  VALU FLOPs (F64):
    rst: 64-bit floating-point operations per second on the VALU, counted from the FP64 instruction counter (SQ_INSTS_VALU_DP_sum). The peak is 4 FLOPs/CU/cycle, since FP64 runs at 1/32 of the FP32 FMA rate on RDNA.
    unit: GFLOP/s
  IPC:
    rst: Instructions executed per cycle, a measure of overall instruction throughput efficiency. Low IPC may indicate stalls due to memory latency, register dependencies, or insufficient wavefront occupancy to hide latencies.
    unit: Instructions per Cycle
  Wavefront Occupancy:
    rst: Average number of wavefronts resident on the GPU during kernel execution. Higher occupancy hides memory latency better but is not always optimal, and register or LDS usage per wavefront may limit it.
    unit: Wavefronts
  GL2 Cache Hit Rate:
    rst: Percentage of GL2 cache requests that are serviced from cache without accessing system memory. Low hit rates may indicate poor data locality or working sets that exceed cache capacity.
    unit: Percent
  GL2-Fabric Read BW:
    rst: The number of bytes the GL2 cache reads from the memory fabric or system memory, divided by total duration. Its peak requires $max_mclk populated in sysinfo (max MEM clock from amd-smi).
    unit: GB/s
  GL2-Fabric Write BW:
    rst: The number of bytes the GL2 cache writes to the memory fabric or system memory, divided by total duration. High values indicate write-intensive workloads.
    unit: GB/s
  LDS Bank Conflicts:
    rst: Number of Local Data Share bank conflicts during execution. Bank conflicts occur when multiple work-items in a wavefront access the same LDS bank simultaneously, causing serialized accesses.
    unit: Conflicts
  Wave Dependency Wait:
    rst: Percentage of wavefront execution time spent waiting for data dependencies to resolve, such as pending memory operations or prior instruction results. High values indicate latency-bound execution that could benefit from increased occupancy or reduced dependency chains.
    unit: Percent
  Wave Issue Wait:
    rst: Percentage of wavefront execution time spent waiting for instructions to become ready for issue. High values may indicate instruction cache misses, complex control flow, or pipeline stalls preventing instruction dispatch.
    unit: Percent
  GL0 Cache Hit Rate (TCP Cache):
    rst: Percentage of GL0 vector cache (TCP Cache) requests that hit in cache; the TCP cache is the first-level cache for vector memory operations. High hit rates reduce traffic to the GL1 cache and improve memory access latency.
    unit: Percent
  GL0 Cache BW:
    rst: The number of bytes the shader cores request from the GL0 vector cache (TCP Cache), divided by total duration. High bandwidth indicates memory-intensive workloads.
    unit: GB/s
  GL1 Cache Hit Rate:
    rst: Percentage of L1 cache (GL1C) requests that hit in cache; GL1C is shared across the workgroup processors of a shader engine. Higher hit rates reduce traffic to the L2 cache and improve performance.
    unit: Percent
  GL1 Cache Read BW:
    rst: The number of bytes L1 (GL1C) reads from L2 (GL2C) to service L1 cache misses, divided by total duration. Lower values indicate better L1 cache efficiency.
    unit: GB/s
  GL2 Cache BW:
    rst: Bandwidth of read operations at the L2 cache level. This metric shows overall L2 cache utilization and helps identify memory subsystem bottlenecks.
    unit: GB/s
  Scalar Data Cache Hit Rate:
    rst: Percentage of sL1D requests that hit on a previously loaded line in the cache. Calculated as the number of sL1D hits over the number of hits and misses, excluding duplicate misses.
    unit: Percent
  Scalar Data Cache BW:
    rst: Bandwidth of scalar data cache requests to the GL1 cache. Scalar operations load uniform data shared across all threads in a wavefront, making efficient caching critical for performance.
    unit: GB/s
  Instruction Cache Hit Rate:
    rst: Percentage of L1I requests that hit on a previously loaded line in the cache. Calculated as the number of L1I hits over the number of hits and misses, excluding duplicate misses.
    unit: Percent
  Instruction Cache BW:
    rst: Bandwidth of instruction cache requests to the GL1 cache. High values may indicate instruction cache pressure from large kernels or frequent instruction cache misses.
    unit: GB/s
Memory chart - Instruction Cache:
  ICache Requests:
    rst: ''
