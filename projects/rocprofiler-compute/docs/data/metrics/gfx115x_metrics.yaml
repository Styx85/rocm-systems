Memory chart - GCEA to System Memory:
  SysArb Utilization:
    rst: Percentage of cycles the System Arbiter, which handles traffic between the GPU caches and the system memory interface, is actively processing memory requests. High utilization indicates significant off-chip memory activity.
    unit: Percent
  SysArb Stall Rate:
    rst: ''
    unit: Percent
  DRAM Read Bandwidth:
    rst: The number of bytes read from system memory (DDR5/LPDDR5 on RDNA 3.5 APUs), divided by total duration. High read bandwidth indicates memory-intensive read patterns, a key sign of memory-bound workloads.
    unit: GB/s
  DRAM Write Bandwidth:
    rst: The number of bytes written to system memory, divided by total duration. High write bandwidth indicates write-intensive workloads.
    unit: GB/s
  DRAM Read Requests:
    rst: DRAM read requests per client group from the GCEA memory path (GCEA_RDRAM_REQ_PER_CLIGRP_sum / $denom).
    unit: Requests per Normalization Unit
  DRAM Write Requests:
    rst: DRAM write requests per client group from the GCEA memory path (GCEA_WDRAM_REQ_PER_CLIGRP_sum / $denom).
    unit: Requests per Normalization Unit
  Read Returns:
    rst: Valid read-return events on the GCEA return path per normalization unit (GCEA_RRET_VLD_sum / $denom).
    unit: Count per Normalization Unit
  Write Returns:
    rst: Valid write-return events on the GCEA return path per normalization unit (GCEA_WRET_VLD_sum / $denom).
    unit: Count per Normalization Unit
Memory chart - Workgroup Processors (WGPs):
  Wavefront Occupancy:
    rst: Resident :ref:`wavefronts <desc-wavefront>` per WGP, averaged over GPU-active cycles, as a percent of the maximum wavefronts per WGP.
    unit: Percent
  VGPR:
    rst: 'The number of architected vector general-purpose registers allocated per wavefront. Note: this may not exactly match the number of VGPRs requested by the compiler due to allocation granularity.'
    unit: Registers
  SGPR:
    rst: 'The number of scalar general-purpose registers allocated per wavefront. Note: this may not exactly match the number of SGPRs requested by the compiler due to allocation granularity.'
    unit: Registers
  LDS Allocation:
    rst: 'The number of bytes of LDS memory (or, shared memory) allocated per :ref:`workgroup <desc-workgroup>`. Note: This may also be larger than what was requested at compile time due to both allocation granularity and dynamic per-dispatch LDS allocations.'
    unit: Bytes per Workgroup
  Scratch Allocation:
    rst: 'The amount of scratch memory requested per :ref:`wavefront <desc-wavefront>`, in KB: the scratch bytes requested per :ref:`work-item <desc-work-item>` multiplied by the wavefront size. Scratch memory is used for stack memory on the accelerator, as well as for register spills and restores.'
    unit: KB per Wavefront
  Workgroups:
    rst: The number of :ref:`workgroups <desc-workgroup>` in the launch divided by the number of WGPs.
    unit: Workgroups per WGP
Roofline Performance Rates:
  VALU FLOPs:
    rst: VALU floating-point operations per second, counted as all VALU instructions times the wavefront size. The peak assumes single-issue FP32 FMA (128 FLOPs/CU/cycle); VOPD dual-issue doubles throughput to 256 FLOPs/CU/cycle for FP32 and 512 for packed FP16.
    unit: GFLOP/s
  VALU FLOPs (F64):
    rst: 64-bit floating-point operations per second on the VALU, counted from the FP64 instruction counter (SQ_INSTS_VALU_DP_sum). The peak is 4 FLOPs/CU/cycle, since FP64 runs at 1/32 of the FP32 FMA rate on RDNA.
    unit: GFLOP/s
  GL2 Cache BW:
    rst: The number of bytes transferred between the GL1 and GL2 caches by GL1 misses, divided by total duration. High bandwidth relative to peak may indicate GL1 cache pressure or poor data locality at the GL1 level.
    unit: GB/s
  GL1 Cache BW:
    rst: The number of bytes transferred between the GL0 (TCP Cache) and GL1 caches by GL0 misses, divided by total duration. High bandwidth relative to peak may indicate cache pressure at the GL0 level or memory access patterns with poor locality.
    unit: GB/s
  GL0 Cache BW:
    rst: The number of bytes the shader cores request from the GL0 vector cache (TCP Cache), divided by total duration. High bandwidth indicates memory-intensive workloads.
    unit: GB/s
  LDS BW:
    rst: 'Estimated achieved Local Data Share bandwidth: LDS active cycles without bank conflicts times 4 bytes per bank, divided by total duration. RDNA 3.5 provides 32 LDS banks per compute unit.'
    unit: GB/s
Roofline Plot Points:
  AI L2:
    rst: 'Arithmetic Intensity relative to the L2 cache: compute operations per byte of L2 cache traffic. Higher values indicate better data reuse upstream of L2, while lower values suggest heavy traffic into L2.'
    unit: FLOPs/Byte
  AI L1:
    rst: 'Arithmetic Intensity relative to the L1 cache: compute operations per byte of L1 cache traffic. Higher values indicate better data reuse upstream of L1, while lower values suggest heavy traffic into L1.'
    unit: FLOPs/Byte
  AI L0:
    rst: 'Arithmetic Intensity relative to the L0 cache (TCP): compute operations per byte of data loaded. Higher values suggest compute-bound behavior; lower values suggest memory-bound behavior limited by L0 bandwidth.'
    unit: FLOPs/Byte
  AI LDS:
    rst: 'Arithmetic Intensity relative to the Local Data Share (LDS): compute operations per byte of LDS traffic. Higher values suggest effective reuse of shared data within a workgroup; lower values suggest behavior limited by LDS bandwidth or bank-conflict pressure.'
    unit: FLOPs/Byte
  Performance (GFLOPs):
    rst: Achieved compute throughput measured in billions of floating-point operations per second. This value, combined with arithmetic intensity, determines the kernel's position on the roofline chart for performance analysis.
    unit: GFLOP/s
CPC Utilization:
  CPC Busy:
    rst: Percentage of time the Command Processor Compute is actively processing commands. Low values may indicate gaps in workload submission or dispatch bottlenecks.
    unit: Percent
  CPC Idle:
    rst: Percentage of time the Command Processor Compute has no work to process. High idle time indicates underutilization, often due to gaps between kernel dispatches or insufficient workload to keep the GPU busy.
    unit: Percent
  CPC Stalled:
    rst: Percentage of time the Command Processor Compute is stalled waiting for resources. High stall rates may indicate memory bottlenecks, synchronization issues, or contention for internal command processor resources.
    unit: Percent
CPC Interface Utilization:
  TCIU Busy:
    rst: Percentage of time the Texture Cache Interface Unit is busy handling command processor memory requests. High utilization indicates significant memory traffic from command processing activities.
    unit: Percent
  UTCL2 Busy:
    rst: Percentage of time the Unified Translation Cache L2 interface is busy handling address translation requests. High utilization may indicate heavy virtual memory activity or TLB pressure.
    unit: Percent
  GCRIU Busy:
    rst: Percentage of time the Graphics Cache Rinse Interface Unit, which handles cache coherency operations, is busy. High utilization may indicate frequent cache flushes or synchronization points.
    unit: Percent
MEC Stall Cycles:
  ME1 Stall on RCIU Ready:
    rst: Cycles the Micro Engine is stalled waiting for the Register Cache Interface Unit, per normalization unit. High stall counts may indicate register allocation bottlenecks or excessive register pressure during command processing.
    unit: Cycles per Normalization Unit
  ME1 Stall on Memory Read:
    rst: Cycles the Micro Engine is stalled waiting for memory read operations to complete, per normalization unit. High stall counts indicate memory latency is impacting command processing throughput.
    unit: Cycles per Normalization Unit
  ME1 Stall on Memory Write:
    rst: Cycles the Micro Engine is stalled waiting for memory write operations to complete, per normalization unit. High stall counts may indicate memory bandwidth saturation or write queue pressure.
    unit: Cycles per Normalization Unit
  ME1 Stall on ROQ Data:
    rst: Cycles the Micro Engine is stalled waiting for data from the Ring Output Queue, per normalization unit. High stall counts may indicate command stream processing bottlenecks.
    unit: Cycles per Normalization Unit
CPC Memory Requests:
  TCIU Read Requests:
    rst: Number of read requests issued by the command processor through the texture cache interface, per normalization unit. These requests fetch command buffer data and kernel arguments.
    unit: Count per Normalization Unit
  TCIU Write Requests:
    rst: Number of write requests issued by the command processor through the texture cache interface, per normalization unit. These handle completion signals and status updates.
    unit: Count per Normalization Unit
  GUS Read Requests:
    rst: Number of read requests to the Global Unified Shader memory interface, per normalization unit. This path handles direct memory access for command processor operations.
    unit: Count per Normalization Unit
  GUS Write Requests:
    rst: Number of write requests to the Global Unified Shader memory interface, per normalization unit. High write counts may indicate frequent state updates or completion notifications.
    unit: Count per Normalization Unit
MEC Instruction Cache:
  Instruction Cache Hits:
    rst: Number of Micro Engine instruction fetches serviced from the instruction cache, per normalization unit. Higher hit counts indicate good instruction locality in command processing code.
    unit: Count per Normalization Unit
  Instruction Cache Misses:
    rst: Number of Micro Engine instruction fetches that missed in the instruction cache, per normalization unit. High miss counts increase command processing latency due to memory fetches.
    unit: Count per Normalization Unit
  Instruction Cache Hit Rate:
    rst: Percentage of Micro Engine instruction fetches that hit in cache. Low rates may indicate complex or large command processing routines.
    unit: Percent
SPI Utilization:
  SPI Busy:
    rst: Percentage of GPU active cycles where the Shader Processor Input is busy dispatching wavefronts. Low values may suggest insufficient parallelism or dispatch bottlenecks limiting GPU utilization.
    unit: Percent
Wave Dispatch Statistics:
  Compute Wave Dispatches:
    rst: Total number of compute wavefronts dispatched by the Shader Processor Input, per normalization unit. Compare with completed wavefronts to identify dispatch-related bottlenecks.
    unit: Count per Normalization Unit
  Wave Dispatch Rate:
    rst: Average wavefronts dispatched per GPU active cycle; values greater than one indicate parallel dispatch across multiple shader engines. Low dispatch rates may indicate workload submission bottlenecks or insufficient parallelism in the application.
    unit: Wavefronts per Cycle
